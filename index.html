<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f66">
  <title>Talking Head</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="stage-wrap" aria-label="Talking head">
      <div id="avatar" class="stage"></div>
      <p id="caption" class="caption" aria-live="polite"></p>
      <div id="picker" class="picker" role="radiogroup" aria-label="Choose avatar"></div>
    </section>

    <section class="panel" aria-label="Controls">
      <h1>Talking Head</h1>

      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="he" aria-pressed="false" lang="he">עברית</button>
      </div>

      <label class="field">
        <span class="field-head">
          <span>Text to read</span>
          <button type="button" id="sample" class="link">Use sample</button>
        </span>
        <textarea id="text" rows="5" dir="ltr" spellcheck="false"></textarea>
      </label>

      <button type="button" id="speak" class="speak" aria-label="Read text aloud">
        <svg class="icon play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon stopi" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span class="label">Read aloud</span>
      </button>

      <p id="status" class="status" hidden></p>

      <details class="settings">
        <summary>Voice settings</summary>
        <label class="field">
          <span>Voice</span>
          <select id="voice"></select>
        </label>
        <label class="field range">
          <span>Speed <output id="rate-out"></output></span>
          <input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1">
        </label>
        <label class="field range">
          <span>Pitch <output id="pitch-out"></output></span>
          <input id="pitch" type="range" min="0.6" max="1.6" step="0.1" value="1.1">
        </label>
      </details>
    </section>
  </main>

  <script src="js/visemes.js"></script>
  <script src="js/looks.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
